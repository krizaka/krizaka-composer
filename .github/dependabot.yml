# Dependabot — the Krizaka model (weekly, grouped; krizaka/.github#332). Minor and patch grouped, majors alone and never
# auto-merged; security fixes as soon as an advisory is published. Auto-merge is krizaka/.github's dependabot-automerge.yml.
# Upstream (puckeditor/puck) fixes come in as cherry-picks, not through Dependabot (docs/agents.md « Upstream »).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "ci(deps)"
    labels: ["area:deps"]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
    groups:
      krizaka:
        patterns: ["@krizaka/*"]
        update-types: ["minor", "patch"]
      minor-patch:
        patterns: ["*"]
        exclude-patterns: ["@krizaka/*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
    labels: ["area:deps"]
    open-pull-requests-limit: 5
