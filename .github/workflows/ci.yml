name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The pipeline is the org's (krizaka/.github docs/standards/ci-and-deploy.md, profile `library`): the changes gate, the
  # pnpm cache, the legs, the timeouts and the gate that always reports live there. This file says only what is Krizaka
  # Composer's: Puck's own scripts (turbo) for lint, format, tests and build.
  ci:
    uses: krizaka/.github/.github/workflows/node-ci.yml@78bf1fb49a07a07de293c626871da66230d441b2 # main (merge queue, layout guard)
    permissions:
      contents: read
    with:
      package-manager: pnpm
      node-version: "24"
      lint-script: lint
      format-script: format:check
      test-script: test
      build-script: build
      # SonarCloud CI analysis: the required "SonarCloud Code Analysis" must also report on merge_group, where the app's automatic analysis does not run (krizaka-internal#1904).
      sonar: true
      sonar-coverage-paths: packages/core/coverage/lcov.info
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
